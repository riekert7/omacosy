# AeroSpace template — i3-like tiling with omarchy's keybinding scheme.
# @PLACEHOLDERS@ are filled from config/apps.conf (+ apps.local.conf)
# by install.sh, which writes the real aerospace.toml next to this file.
# "Super" = Caps Lock, remapped by Karabiner to cmd+ctrl+alt — a combo
# nothing on macOS uses, so bindings never collide with typing or apps.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

start-at-login = true
after-login-command = []
after-startup-command = []

# flatten is OFF because it dissolves the very container `split` makes,
# and `split` is how the dwindle direction gets set (see below).
# AeroSpace says so itself if you try: "'split' has no effect when
# 'enable-normalization-flatten-containers' normalization enabled".
# Empty containers are still reaped without it — closing a window hands
# its space back to its sibling, which is the part that mattered.
# opposite-orientation stays OFF — it is the inverse of Hyprland's
# preserve_split=true and made Super+J's togglesplit cascade through
# every nested container instead of flipping the one pair.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 30
default-root-container-layout = 'tiles'
# 'auto' = split along the monitor's longer edge, which is the same
# rule the dwindle hint below applies to every window after it
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Hyprland's dwindle splits the focused window along ITS longer edge,
# so the next window lands beside a wide one and below a tall one.
# AeroSpace has no such layout and no window geometry in its config
# language (the format variables are ids, titles and container layouts
# — no width or height), so the direction is decided in code and set
# with `split` BEFORE the next window exists. AeroSpace then places
# that window correctly in its first pass; the old daemon corrected the
# tree afterwards, which is why the screen used to lay out twice.
#
# One hook covers both ways focus moves: AeroSpace fires it for its own
# keyboard commands AND for the focus omacosy-ffm moves under the mouse
# (it does notice those, despite moving focus via SLPS itself).
# AEROSPACE_WINDOW_ID names the newly focused window.
on-focus-changed = ['exec-and-forget $HOME/.local/bin/omacosy-helper split-hint']

# Tell the bar which workspace is focused — a bash builtin redirect,
# no extra process, and a regular file so a dead reader cannot wedge it
exec-on-workspace-change = ['/bin/bash', '-c',
  'touch /tmp/omacosy-ws-switch; echo "$AEROSPACE_FOCUSED_WORKSPACE" > /tmp/omacosy-bar-ws; $HOME/.local/bin/omacosy-focus-guard'
]

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.right = 8
# room for the bar: the bar window is 34pt tall and sits at the top of
# the display's *frame*, + 8 to match the other gaps = 42.
# NOT less on a notched built-in: macOS does carve the notch strip out
# of the frame (15" Air: 1440x932 panel -> 1440x900 frame), but the bar
# is drawn at the top of that 900 — inside the tiling area, not up in
# the strip — so the laptop needs exactly the same 42 as a flat monitor.
# A smaller value here puts every tiled window under the bar.
outer.top = 42

# Fixed-size settings windows fight the tiler (resize -> snap back ->
# relayout flicker); float them instead.
[[on-window-detected]]
if.app-id = 'org.pqrs.Karabiner-Elements.Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

# TUI utility windows (activity monitor etc.) float like omarchy's
[[on-window-detected]]
if.window-title-regex-substring = 'omacosy-activity'
run = 'layout floating'

# Omarchy's map, Super = Caps Lock (cmd-ctrl-alt). Two layers, like
# omarchy: Super for window management, Super+Shift for moving and apps.
[mode.main.binding]
# Terminal / browser (omarchy: Super+Return, Super+Shift+Return)
# through omacosy-spawn: spawns are serialized so each window's dwindle
# split hint lands before the next window opens — spamming this chord
# gives a clean spiral instead of a simultaneous flat pile
cmd-ctrl-alt-enter = 'exec-and-forget $HOME/.local/bin/omacosy-spawn "@TERMINAL@"'
cmd-ctrl-alt-shift-enter = 'exec-and-forget open -na "@BROWSER@" --args --new-window'

# Launcher (omarchy: Super+Space)
cmd-ctrl-alt-space = 'exec-and-forget open -a Raycast'

# Close window (omarchy: Super+W)
cmd-ctrl-alt-w = 'close'

# Focus (omarchy: Super+Arrows)
# Hyprland's movefocus spills onto the next display when there is no
# window that way; aerospace stops at the workspace edge by default, so
# focus could never leave a monitor. all-monitors-outer-frame restores
# the omarchy behaviour — only the outer frame of ALL monitors stops it.
cmd-ctrl-alt-left = 'focus --boundaries all-monitors-outer-frame left'
cmd-ctrl-alt-down = 'focus --boundaries all-monitors-outer-frame down'
cmd-ctrl-alt-up = 'focus --boundaries all-monitors-outer-frame up'
cmd-ctrl-alt-right = 'focus --boundaries all-monitors-outer-frame right'

# Move windows (omarchy: Super+Shift+Arrows)
# omarchy's binding is hyprland's `swapwindow`, which EXCHANGES with the
# neighbour and crosses monitors doing it. aerospace's `swap` cannot
# leave the workspace, and each monitor here shows a different one, so
# the exchange lives in a wrapper: move inside the workspace, swap at
# the monitor edge, plain push when the other side is empty.
cmd-ctrl-alt-shift-left = 'exec-and-forget $HOME/.local/bin/omacosy-move-swap left'
cmd-ctrl-alt-shift-down = 'exec-and-forget $HOME/.local/bin/omacosy-move-swap down'
cmd-ctrl-alt-shift-up = 'exec-and-forget $HOME/.local/bin/omacosy-move-swap up'
cmd-ctrl-alt-shift-right = 'exec-and-forget $HOME/.local/bin/omacosy-move-swap right'

# Layout (omarchy: Super+T float toggle, Super+J split toggle, Super+F fullscreen)
cmd-ctrl-alt-t = 'layout floating tiling'
# Keybinding cheatsheet (omarchy: Super+K) — the bar renders it from
# THIS file, so the sheet cannot drift from the keys it documents.
cmd-ctrl-alt-k = 'exec-and-forget /usr/bin/touch /tmp/omacosy-bar-cheatsheet'

# Floats
# Surface the next float on this workspace (S for surface). macOS
# z-orders windows per APP, so a float sinks behind whichever app you
# focus next and cannot be pinned on top without a private window-level
# call; this is how you get it back, cursor and all.
cmd-ctrl-alt-s = 'exec-and-forget $HOME/.local/bin/omacosy-float'
# wrapper-aware: the dwindle hint's solo container makes the bare
# commands no-op or misfire (issue #3) — omacosy-layout compensates
cmd-ctrl-alt-j = 'exec-and-forget $HOME/.local/bin/omacosy-layout togglesplit'
cmd-ctrl-alt-f = 'fullscreen --no-outer-gaps'
# native (green-button) fullscreen: the only mode that may claim the
# notch strip on the built-in display; deliberate enter/exit only
cmd-ctrl-alt-n = 'macos-native-fullscreen'

# Resize (omarchy: Super+Minus / Super+Equal)
cmd-ctrl-alt-minus = 'exec-and-forget $HOME/.local/bin/omacosy-layout resize -50'
cmd-ctrl-alt-equal = 'exec-and-forget $HOME/.local/bin/omacosy-layout resize +50'

# Workspaces (omarchy: Super+N, Super+Shift+N, Super+Tab)
cmd-ctrl-alt-1 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 1'
cmd-ctrl-alt-2 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 2'
cmd-ctrl-alt-3 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 3'
cmd-ctrl-alt-4 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 4'
cmd-ctrl-alt-5 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 5'
cmd-ctrl-alt-6 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 6'
cmd-ctrl-alt-7 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 7'
cmd-ctrl-alt-8 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 8'
cmd-ctrl-alt-9 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 9'

cmd-ctrl-alt-shift-1 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 1 move'
cmd-ctrl-alt-shift-2 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 2 move'
cmd-ctrl-alt-shift-3 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 3 move'
cmd-ctrl-alt-shift-4 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 4 move'
cmd-ctrl-alt-shift-5 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 5 move'
cmd-ctrl-alt-shift-6 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 6 move'
cmd-ctrl-alt-shift-7 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 7 move'
cmd-ctrl-alt-shift-8 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 8 move'
cmd-ctrl-alt-shift-9 = 'exec-and-forget $HOME/.local/bin/omacosy-ws 9 move'

# Workspace navigation (omarchy: Super+Tab / Super+Shift+Tab). These
# cycle within the focused MONITOR's own set — aerospace's own
# `workspace next` walks every workspace on the machine and hops
# displays, and undocked it wanders into the parked 11-19 guests.
cmd-ctrl-alt-tab = 'exec-and-forget $HOME/.local/bin/omacosy-ws 0 next'
cmd-ctrl-alt-shift-tab = 'exec-and-forget $HOME/.local/bin/omacosy-ws 0 prev'
# Back-and-forth
# Super+Tab is spent on the above, so omarchy puts it on
# Super+Ctrl+Tab, which we cannot express: Super IS cmd+ctrl+alt, so
# ctrl and alt are already spent and only Shift is left as a layer.
cmd-ctrl-alt-b = 'workspace-back-and-forth'

# Cycle windows WITHIN the workspace (omarchy: Alt+Tab). macOS's own
# switcher is Cmd+Tab and switches APPS; nothing reaches a third window
# on a workspace without this.
# Not `focus dfs-next`: it ignores --boundaries workspace, measured — it
# walked from a window on workspace 3 to Slack on 4 and then Arc on 1.
# omacosy-cycle walks this workspace's own window list instead, floats
# included, so it is also the one switcher that reaches a sunken float.
alt-tab = 'exec-and-forget $HOME/.local/bin/omacosy-cycle next'
alt-shift-tab = 'exec-and-forget $HOME/.local/bin/omacosy-cycle prev'

# Cycle focus between monitors (omarchy: Ctrl+Alt+Tab, and free here)
ctrl-alt-tab = 'focus-monitor next --wrap-around'
# Super+O ('output', Hyprland's word for a monitor). ctrl-alt-tab above
# needs three awkward modifiers under the Windows-style Karabiner layout
# (physical Cmd + Caps Lock + Tab), so this is the one-hand version.
cmd-ctrl-alt-o = 'focus-monitor next --wrap-around'

# Move this WORKSPACE to the other monitor (omarchy:
# Super+Shift+Alt+Arrow -> movecurrentworkspacetomonitor). That chord
# cannot exist here: Super IS cmd+ctrl+alt, so Super+Alt+X is byte-
# identical to Super+X. It lands on Shift+O instead, pairing with
# Super+O above ('output'). With two displays `next` == directional.
cmd-ctrl-alt-shift-o = 'move-workspace-to-monitor --wrap-around next'
# Apps (omarchy: Super+Shift+letter)
cmd-ctrl-alt-shift-f = 'exec-and-forget open ~'          # files
cmd-ctrl-alt-shift-m = 'exec-and-forget open -a "@MUSIC@"' # music
cmd-ctrl-alt-shift-g = 'exec-and-forget open -a "@MESSENGER@"'   # messenger (omarchy: G)

# AI agents
# (omarchy: Super+A ChatGPT, Super+Shift+A Grok — here both are Claude:
# the desktop app, and Claude Code in a terminal. The CLI cannot go
# through omacosy-spawn, which takes an app name and no command, so it
# uses Ghostty's -e — exec, not a shell, hence the wrapper script.)
cmd-ctrl-alt-a = 'exec-and-forget $HOME/.local/bin/omacosy-spawn "Claude"'
cmd-ctrl-alt-shift-a = 'exec-and-forget open -na Ghostty --args -e $HOME/.local/bin/omacosy-agent'

# Lock the screen (omarchy: Super+Ctrl+L — ctrl is spent, so Shift+L)
cmd-ctrl-alt-shift-l = 'exec-and-forget $HOME/.local/bin/omacosy-helper lock'

# Theme cycle
# T for theme; float lives on plain Super+T
cmd-ctrl-alt-shift-t = 'exec-and-forget $HOME/.local/bin/theme-next'
cmd-ctrl-alt-shift-b = 'exec-and-forget $HOME/.local/bin/theme-bg-next'

# Modes
cmd-ctrl-alt-r = 'mode resize'
cmd-ctrl-alt-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']  # reset layout
backspace = ['close-all-windows-but-current', 'mode main']

